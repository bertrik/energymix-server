apply plugin: "application"

application {
    mainClass = 'nl.bertriksikken.energymix.app.EnergyMixApp'
}

dependencies {
    implementation(platform(libs.jetty.bom)) { because("dropwizard depends on older version with CVEs") }

    implementation libs.bundles.retrofit
    implementation libs.bundles.jackson
    implementation libs.bundles.dropwizard
}

